[project]
name = "nuvexadb"
version = "1.0.0"
description = "Python SDK for NuvexaDB over the Native AOT C ABI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niladri Prasad Padhy" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nuvexadb*"]
