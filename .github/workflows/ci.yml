name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test tests/Nuventra.NuvexaDB.Tests/Nuventra.NuvexaDB.Tests.csproj -c Release --nologo
      - name: Build explorer and CLI
        run: |
          dotnet build src/Nuventra.NuvexaDB.Explorer/Nuventra.NuvexaDB.Explorer.csproj -c Release --nologo
          dotnet build src/Nuventra.NuvexaDB.Cli/Nuventra.NuvexaDB.Cli.csproj -c Release --nologo
          dotnet build src/Nuventra.NuvexaDB.VisualStudio/Nuventra.NuvexaDB.VisualStudio.csproj -c Release --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile VS Code extension
        working-directory: src/Nuventra.NuvexaDB.VSCode
        run: npm install && npm run compile
      - name: SLO gate
        run: dotnet run --project benches/Nuventra.NuvexaDB.Benchmarks -c Release -- --gate

  pack:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          dotnet pack src/Nuventra.NuvexaDB/Nuventra.NuvexaDB.csproj -c Release -o artifacts
          dotnet pack src/Nuventra.NuvexaDB.Tools/Nuventra.NuvexaDB.Tools.csproj -c Release -o artifacts
          dotnet pack src/Nuventra.NuvexaDB.Cli/Nuventra.NuvexaDB.Cli.csproj -c Release -o artifacts
      - name: Push nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_KEY }} --skip-duplicate
      - name: Push GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push artifacts/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
