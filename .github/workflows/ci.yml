name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: write  # required when nuget.org / GitHub Packages push is uncommented

jobs:
  # ---------------------------------------------------------------------------
  # Paused: version alignment + nuget.org validation.
  # NuvexaDB will later publish to more than one host (.NET NuGet, Maven
  # Central, npm, pub.dev, …). Uncomment these jobs and the pack push step
  # when those hosts are decided. Until then CI builds, tests, and uploads
  # GitHub artifacts the same way Explorer / VS Code / Visual Studio already do.
  # ---------------------------------------------------------------------------
  # version-align:
  #   name: Version alignment
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 5
  #   outputs:
  #     version: ${{ steps.check.outputs.version }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - id: check
  #       run: python3 .github/scripts/check-versions.py --repo-root .
  #
  # version-check:
  #   name: NuGet release
  #   needs: [version-align]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Check NUGET_KEY and published version
  #       env:
  #         NUGET_KEY: ${{ secrets.NUGET_KEY }}
  #       run: python3 .github/scripts/check-nuget-release.py --plugin-root .

  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          version="$(python3 -c "import re, pathlib; text=pathlib.Path('Directory.Build.props').read_text(); print(re.search(r'<Version>([^<]+)</Version>', text).group(1))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Directory.Build.props Version=$version (alignment / NuGet validation commented out)"

  test:
    name: Unit tests (${{ matrix.os }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test engine, Explorer IDE, and Visual Studio
        run: dotnet test tests/Nuventra.NuvexaDB.Tests/Nuventra.NuvexaDB.Tests.csproj -c Release --nologo
      - name: SLO gate
        run: dotnet run --project benches/Nuventra.NuvexaDB.Benchmarks -c Release -- --gate

  native:
    name: Native ABI ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Host C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Host C toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\mingw64\\bin" >> "$GITHUB_PATH"
          /c/mingw64/bin/gcc -dumpmachine
      - name: Publish C ABI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/Nuventra.NuvexaDB.Native/publish.sh
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.rid }}" \
            "$PWD/artifacts/native"
      - name: ABI test cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-abi-tests.sh
          .github/scripts/run-abi-tests.sh "$PWD/artifacts/native/${{ matrix.rid }}" host
      - name: Upload native library
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Native ABI (${{ matrix.rid }})"
            echo
            echo "Download: [NuvexaDB-Native-${{ matrix.rid }}](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Load \`libnuvexa\` / \`nuvexa.dll\` from the artifact. Kotlin/Java: \`NUVEXA_NATIVE_LIB\`. Swift: \`NUVEXA_NATIVE_DIR\`."
          } >> "$GITHUB_STEP_SUMMARY"

  native-android:
    name: Native ABI android-arm64
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Publish C ABI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/Nuventra.NuvexaDB.Native/publish.sh
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            android-arm64 \
            "$PWD/artifacts/native"
      - name: ABI test cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-abi-tests.sh
          .github/scripts/run-abi-tests.sh "$PWD/artifacts/native/android-arm64" android-arm64
      - name: Upload native library
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Native ABI (android-arm64)"
            echo
            echo "Download: [NuvexaDB-Native-android-arm64](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Bionic Native AOT (\`linux-bionic-arm64\`) as \`libnuvexa.so\` for \`jniLibs/arm64-v8a\`."
          } >> "$GITHUB_STEP_SUMMARY"

  native-ios:
    name: iOS module compile
    needs: [version, test]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile React Native iOS module
        run: |
          set -euo pipefail
          chmod +x .github/scripts/compile-rn-ios.sh
          mkdir -p artifacts/native/ios
          cp src/Nuventra.NuvexaDB.Native/include/nuvexa.h artifacts/native/ios/
          .github/scripts/compile-rn-ios.sh \
            src/Nuventra.NuvexaDB.Native \
            "$PWD/artifacts/native/ios"
      - name: Upload iOS headers and module
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-iOS
          path: artifacts/native/ios/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### iOS module"
            echo
            echo "Download: [NuvexaDB-Native-iOS](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo ".NET Native AOT cannot publish \`ios-arm64\` (NETSDK1203). This artifact is \`nuvexa.h\` plus a compiled \`NuvexaDB.o\`. Golden ABI cases for Apple run on the \`osx-arm64\` dylib."
          } >> "$GITHUB_STEP_SUMMARY"

  vscode:
    name: VS Code extension
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test VS Code extension
        working-directory: src/Nuventra.NuvexaDB.VSCode
        run: |
          set -euo pipefail
          npm ci
          npm test
      - name: Pack VSIX
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          chmod +x .github/scripts/pack-vscode.sh
          .github/scripts/pack-vscode.sh "$version" "$PWD/artifacts/nuventra.nuvexadb-${version}.vsix"
      - name: Upload VS Code VSIX
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-VS-Code
          path: artifacts/nuventra.nuvexadb-*.vsix
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### VS Code VSIX"
            echo
            echo "Download: [NuvexaDB-VS-Code](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Then update the Visual Studio Code listing at [Marketplace manage](https://marketplace.visualstudio.com/manage)."
          } >> "$GITHUB_STEP_SUMMARY"

  vsix:
    name: Visual Studio VSIX
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack VSIX
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          chmod +x .github/scripts/pack-vsix.sh
          .github/scripts/pack-vsix.sh "$version" "$PWD/artifacts/Nuventra.NuvexaDB.VisualStudio.${version}.vsix"
      - name: Upload VSIX
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Visual-Studio
          path: artifacts/Nuventra.NuvexaDB.VisualStudio.*.vsix
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### Visual Studio VSIX"
            echo
            echo "Download: [NuvexaDB-Visual-Studio](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Then update **NuvexaDB Explorer for Visual Studio** at [Marketplace manage](https://marketplace.visualstudio.com/manage). Do not create a new listing."
          } >> "$GITHUB_STEP_SUMMARY"

  explorer:
    name: Data Studio ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WiX
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install fpm
        if: startsWith(matrix.rid, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Pack Explorer
        run: |
          set -euo pipefail
          chmod +x .github/scripts/pack-explorer.sh
          .github/scripts/pack-explorer.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.rid }}" \
            "$PWD/artifacts"
        shell: bash
      - name: Upload Explorer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Data-Studio-${{ matrix.rid }}
          path: |
            artifacts/NuvexaDB-Explorer-*.msi
            artifacts/NuvexaDB-Explorer-*.pkg
            artifacts/*.deb
            artifacts/*.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Data Studio (${{ matrix.rid }})"
            echo
            echo "Download: [NuvexaDB-Data-Studio-${{ matrix.rid }}](${{ steps.upload.outputs.artifact-url }})"
            echo
            case "${{ matrix.rid }}" in
              win-*) echo "Install **NuvexaDB-Explorer-*-win-x64.msi** (Start Menu + \`.nvx\` association)." ;;
              osx-*) echo "Install **NuvexaDB-Explorer-*-osx-*.pkg** (unsigned; signing and notarization come later)." ;;
              linux-*) echo "Debian/Ubuntu/Mint: \`sudo dpkg -i nuvexadb-explorer_*_amd64.deb\`. Fedora/RHEL/openSUSE: \`sudo rpm -i nuvexadb-explorer-*-x86_64.rpm\`." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  pack:
    name: NuGet packages
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # permissions:
    #   contents: read
    #   packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet pack src/Nuventra.NuvexaDB/Nuventra.NuvexaDB.csproj -c Release -o artifacts --nologo
          dotnet pack src/Nuventra.NuvexaDB.Tools/Nuventra.NuvexaDB.Tools.csproj -c Release -o artifacts --nologo
          dotnet pack src/Nuventra.NuvexaDB.Cli/Nuventra.NuvexaDB.Cli.csproj -c Release -o artifacts --nologo
          echo "Packed:"
          ls -1 artifacts/*.{nupkg,snupkg}
      - name: Upload nupkg and snupkg
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-NuGet
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14
      # - name: Push nupkg and snupkg
      #   if: github.event_name != 'pull_request'
      #   env:
      #     NUGET_KEY: ${{ secrets.NUGET_KEY }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      #   run: python3 .github/scripts/push-packages.py --packages-dir artifacts
      - name: Summary
        run: |
          {
            echo "### NuGet packages"
            echo
            echo "Download: [NuvexaDB-NuGet](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Artifacts only. nuget.org and GitHub Packages push is commented out until multi-host publishing is decided. \`Nuventra.NuvexaDB.Cli\` is PackAsTool and has no snupkg."
          } >> "$GITHUB_STEP_SUMMARY"

  sdk:
    name: ${{ matrix.title }}
    needs: [version, test, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            sdk: jvm
            product: Java
            title: Java library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: jvm
            product: Java
            title: Java library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: jvm
            product: Java
            title: Java library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: python
            product: Python
            title: Python library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: python
            product: Python
            title: Python library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: python
            product: Python
            title: Python library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: node
            product: Node
            title: Node library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: node
            product: Node
            title: Node library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: node
            product: Node
            title: Node library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: react-native
            product: React-Native
            title: React Native library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: react-native
            product: React-Native
            title: React Native library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: go
            product: Go
            title: Go library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: go
            product: Go
            title: Go library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: cpp
            product: Cpp
            title: C++ library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: cpp
            product: Cpp
            title: C++ library (osx-arm64)
          - os: macos-latest
            rid: osx-arm64
            sdk: swift
            product: Swift
            title: Swift library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: flutter
            product: Flutter
            title: Flutter library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: flutter
            product: Flutter
            title: Flutter library (osx-arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.sdk == 'jvm'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.sdk == 'jvm'
        with:
          gradle-version: "8.12.1"
      - uses: actions/setup-python@v5
        if: matrix.sdk == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.sdk == 'node' || matrix.sdk == 'react-native'
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        if: matrix.sdk == 'go'
        with:
          go-version: "1.22.x"
      - name: Install cgo toolchain
        if: matrix.sdk == 'go' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install CMake
        if: matrix.sdk == 'cpp' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - uses: dart-lang/setup-dart@v1
        if: matrix.sdk == 'flutter'
      - name: Download native ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
      - name: Test and pack ${{ matrix.sdk }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            "${{ matrix.sdk }}" \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/${{ matrix.sdk }}-${{ matrix.rid }}" \
            "$PWD/artifacts/native/${{ matrix.rid }}"
      - name: Upload ${{ matrix.sdk }}
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-${{ matrix.product }}-${{ matrix.rid }}
          path: artifacts/sdk/${{ matrix.sdk }}-${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.title }}"
            echo
            echo "Download: [NuvexaDB-${{ matrix.product }}-${{ matrix.rid }}](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Unit tests passed against \`NuvexaDB-Native-${{ matrix.rid }}\`. Host publish (Maven, npm, PyPI, pub.dev, Swift) stays commented out."
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android AAR
    needs: [version, test, native, native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-linux-x64
          path: artifacts/native/linux-x64
      - name: Download Android ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64
      - name: JVM unit tests (shared Android Kotlin)
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            jvm \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/android-jvm-tests" \
            "$PWD/artifacts/native/linux-x64"
      - name: Assemble AAR
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            android \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/android" \
            "$PWD/artifacts/native/android-arm64"
      - name: Upload Android AAR
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Android
          path: artifacts/sdk/android/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### Android AAR"
            echo
            echo "Download: [NuvexaDB-Android](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Kotlin sources match the Java library tests. The AAR includes \`jni/arm64-v8a/libnuvexa.so\` from \`NuvexaDB-Native-android-arm64\`."
          } >> "$GITHUB_STEP_SUMMARY"

  react-native-android:
    name: React Native Android
    needs: [version, test, native, native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-linux-x64
          path: artifacts/native/linux-x64
      - name: Download Android ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64
      - name: Interop test cases
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-js" \
            "$PWD/artifacts/native/linux-x64"
      - name: Assemble React Native AAR
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native-android \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-android" \
            "$PWD/artifacts/native/android-arm64"
      - name: Upload React Native Android
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-React-Native-Android
          path: artifacts/sdk/react-native-android/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### React Native Android"
            echo
            echo "Download: [NuvexaDB-React-Native-Android](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Gradle \`assembleRelease\` of \`bindings/react-native/android\` with \`libnuvexa.so\`."
          } >> "$GITHUB_STEP_SUMMARY"

  react-native-ios:
    name: React Native iOS
    needs: [version, test, native]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-osx-arm64
          path: artifacts/native/osx-arm64
      - name: Interop test cases
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-js" \
            "$PWD/artifacts/native/osx-arm64"
      - name: Compile iOS module
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native-ios \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-ios" \
            "$PWD/artifacts/native/osx-arm64"
      - name: Upload React Native iOS
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-React-Native-iOS
          path: artifacts/sdk/react-native-ios/
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "### React Native iOS"
            echo
            echo "Download: [NuvexaDB-React-Native-iOS](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Compiled \`NuvexaDB.mm\` for the iOS Simulator. Golden cases ran against the \`osx-arm64\` dylib (\`.NET\` cannot PublishAot \`ios-arm64\`)."
          } >> "$GITHUB_STEP_SUMMARY"
