            "$PWD/artifacts/native/android-arm64"
      - name: Upload React Native Android
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-React-Native-Android
          path: artifacts/sdk/react-native-android/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  react-native-ios:
    name: React Native iOS
    needs: [version, test, native, native-ios]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-osx-arm64
          path: artifacts/native/osx-arm64
      - name: Download iOS ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-iOS
          path: artifacts/native/ios
      - name: Interop test cases
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-js" \
            "$PWD/artifacts/native/osx-arm64"
      - name: Compile iOS module
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native-ios \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-ios" \
            "$PWD/artifacts/native/ios"
      - name: Upload React Native iOS
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-React-Native-iOS
          path: artifacts/sdk/react-native-ios/
          if-no-files-found: error
