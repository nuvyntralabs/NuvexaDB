name: ci

# Everyday pushes and PRs only upload Actions artifacts. They never create or
# update github.com/nuvyntralabs/NuvexaDB/releases. A GitHub Release is created
# only when you push a version tag (v1.0.0) AND every CI job on that run
# succeeded. If v<Version> is already published, the build does not start.
# That is the release control.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Group by commit, not branch. A Yes-release push updates main and then
# tags v* on the same SHA; the tag run cancels the duplicate main run.
# Only the tag run can create a GitHub Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: write  # required when nuget.org / GitHub Packages push is uncommented

jobs:
  # nuget.org / GitHub Packages validation stays paused. Version alignment
  # runs on every CI so NuGet, bindings, Data Studio, and both IDEs share
  # Directory.Build.props <Version>.
  # version-check:
  #   name: NuGet release
  #   needs: [version]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Check NUGET_KEY and published version
  #       env:
  #         NUGET_KEY: ${{ secrets.NUGET_KEY }}
  #       run: python3 .github/scripts/check-nuget-release.py --plugin-root .

  version:
    name: Version alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip_build: ${{ steps.gate.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python3 .github/scripts/check-versions.py --repo-root .
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.version }}"
          skip=false
          # PRs always build. Main / tag / dispatch skip when v{Version} is already published.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if json="$(gh release view "v${version}" --repo "${{ github.repository }}" --json isDraft 2>/dev/null)"; then
              draft="$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('isDraft'))" "$json")"
              if [ "$draft" = "False" ]; then
                skip=true
                echo "GitHub Release v${version} already exists. Skipping the build."
              fi
            fi
          fi
          echo "skip_build=$skip" >> "$GITHUB_OUTPUT"
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  test:
    name: Unit tests (${{ matrix.os }})
    if: needs.version.outputs.skip_build != 'true'
    needs: [version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test engine, Explorer IDE, and Visual Studio
        run: dotnet test tests/Nuventra.NuvexaDB.Tests/Nuventra.NuvexaDB.Tests.csproj -c Release --nologo
      - name: SLO gate
        run: dotnet run --project benches/Nuventra.NuvexaDB.Benchmarks -c Release -- --gate
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  native:
    name: Native ABI ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.rid == 'win-arm64' && 'arm64' || 'amd64' }}
      - name: Host C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Host C toolchain
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          echo "C:\\mingw64\\bin" >> "$GITHUB_PATH"
          /c/mingw64/bin/gcc -dumpmachine
      - name: Host C toolchain
        if: matrix.rid == 'win-arm64'
        shell: bash
        run: |
          set -euo pipefail
          # Native AOT DLLs link with GNU ld, not MSVC (LNK1107 / LNK2019).
          # Git\clangarm64 is Git's ARM64 runtime prefix — it is not a C compiler.
          # windows-11-arm ships MSYS2 at C:\msys64 (not on PATH). CLANGARM64
          # gcc/clang dump aarch64-w64-windows-gnu, same class as win-x64 MinGW.
          is_gnu_arm() {
            local c="$1" dump
            [[ -x "$c" ]] || return 1
            dump="$("$c" -dumpmachine 2>/dev/null || true)"
            echo "$dump" | grep -qiE 'aarch64|arm64' || return 1
            echo "$dump" | grep -qiE 'x86_64|i686' && return 1
            echo "$dump" | grep -qiE 'mingw|windows-gnu' || return 1
            printf '%s' "$dump"
          }
          use_cc() {
            local c="$1" dump
            dump="$(is_gnu_arm "$c")" || return 1
            if command -v cygpath >/dev/null 2>&1; then
              echo "$(cygpath -w "$(dirname "$c")")" >> "$GITHUB_PATH"
            else
              echo "$(dirname "$c")" >> "$GITHUB_PATH"
            fi
            echo "ABI GNU cc=$c dump=$dump"
          }
          if use_cc "/c/msys64/clangarm64/bin/gcc.exe" \
            || use_cc "/c/msys64/clangarm64/bin/clang.exe" \
            || use_cc "/c/Program Files/Git/clangarm64/bin/clang.exe"; then
            exit 0
          fi
          if [[ -x /c/msys64/usr/bin/pacman.exe ]]; then
            echo "Installing MSYS2 CLANGARM64 clang (C:\\msys64 present, no aarch64 GNU cc)"
            /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed \
              mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-gcc
            if use_cc "/c/msys64/clangarm64/bin/gcc.exe" \
              || use_cc "/c/msys64/clangarm64/bin/clang.exe"; then
              exit 0
            fi
          fi
          ver=20260908
          zip="llvm-mingw-${ver}-ucrt-aarch64.zip"
          dest="${RUNNER_TEMP}/llvm-mingw"
          echo "Downloading $zip"
          curl -fsSL -o "${RUNNER_TEMP}/${zip}" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/${zip}"
          rm -rf "$dest"
          mkdir -p "$dest"
          7z x "${RUNNER_TEMP}/${zip}" "-o${dest}"
          shopt -s nullglob
          for cc in "$dest"/llvm-mingw-*-ucrt-aarch64/bin/clang.exe; do
            if use_cc "$cc"; then
              exit 0
            fi
          done
          echo "No aarch64 GNU toolchain (MSYS2 CLANGARM64 or llvm-mingw)." >&2
          ls -la /c/msys64/clangarm64/bin >&2 || true
          ls -la "/c/Program Files/Git/clangarm64/bin" >&2 || true
          exit 1
      - name: Publish C ABI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/Nuventra.NuvexaDB.Native/publish.sh
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.rid }}" \
            "$PWD/artifacts/native"
      - name: ABI test cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-abi-tests.sh
          .github/scripts/run-abi-tests.sh "$PWD/artifacts/native/${{ matrix.rid }}" host
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  native-android:
    name: Native ABI android-arm64
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: Google removed the obsolete SDK Tools package.
          packages: platform-tools
      - name: Android NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Publish C ABI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src/Nuventra.NuvexaDB.Native/publish.sh
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            android-arm64 \
            "$PWD/artifacts/native"
      - name: ABI test cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-abi-tests.sh
          .github/scripts/run-abi-tests.sh "$PWD/artifacts/native/android-arm64" android-arm64
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  native-ios:
    name: Native ABI iOS
    needs: [version, test]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish C ABI (device + simulator)
        run: |
          set -euo pipefail
          chmod +x src/Nuventra.NuvexaDB.Native/publish.sh
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            ios-arm64 \
            "$PWD/artifacts/native"
          src/Nuventra.NuvexaDB.Native/publish.sh \
            "${{ needs.version.outputs.version }}" \
            iossimulator-arm64 \
            "$PWD/artifacts/native"
      - name: Pack Nuvexa.xcframework
        run: |
          set -euo pipefail
          chmod +x .github/scripts/pack-ios-xcframework.sh
          .github/scripts/pack-ios-xcframework.sh \
            "$PWD/artifacts/native" \
            "$PWD/artifacts/native/ios"
      - name: ABI test cases (simulator)
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-abi-tests.sh
          .github/scripts/run-abi-tests.sh "$PWD/artifacts/native/ios" ios-simulator
      - name: Compile React Native iOS module
        run: |
          set -euo pipefail
          chmod +x .github/scripts/compile-rn-ios.sh
          .github/scripts/compile-rn-ios.sh \
            "$PWD/artifacts/native/ios" \
            "$PWD/artifacts/native/ios"
      - name: Upload iOS xcframework
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Native-iOS
          path: artifacts/native/ios/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  vscode:
    name: VS Code ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack VSIX
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          chmod +x .github/scripts/pack-vscode.sh
          .github/scripts/pack-vscode.sh \
            "$version" \
            "${{ matrix.rid }}" \
            "$PWD/artifacts/nuventra.nuvexadb-${version}-${{ matrix.rid }}.vsix"
      - name: Upload VS Code VSIX
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-VS-Code-${{ matrix.rid }}
          path: artifacts/nuventra.nuvexadb-*.vsix
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  vsix:
    name: Visual Studio VSIX
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack VSIX
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          chmod +x .github/scripts/pack-vsix.sh
          .github/scripts/pack-vsix.sh "$version" "$PWD/artifacts/Nuventra.NuvexaDB.VisualStudio.${version}.vsix"
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Visual-Studio
          path: artifacts/Nuventra.NuvexaDB.VisualStudio.*.vsix
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  explorer:
    name: Data Studio ${{ matrix.rid }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WiX
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install fpm
        if: startsWith(matrix.rid, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
      - name: Pack Explorer
        run: |
          set -euo pipefail
          chmod +x .github/scripts/pack-explorer.sh
          .github/scripts/pack-explorer.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.rid }}" \
            "$PWD/artifacts"
        shell: bash
      - name: Upload Explorer
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Data-Studio-${{ matrix.rid }}
          path: |
            artifacts/NuvexaDB-Explorer-*.msi
            artifacts/NuvexaDB-Explorer-*.pkg
            artifacts/*.deb
            artifacts/*.rpm
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  pack:
    name: NuGet packages
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # permissions:
    #   contents: read
    #   packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts/engine artifacts/cli
          dotnet pack src/Nuventra.NuvexaDB/Nuventra.NuvexaDB.csproj -c Release -o artifacts/engine --nologo
          dotnet pack src/Nuventra.NuvexaDB.Cli/Nuventra.NuvexaDB.Cli.csproj -c Release -o artifacts/cli --nologo
          echo "Packed:"
          ls -1 artifacts/engine/*.{nupkg,snupkg}
          ls -1 artifacts/cli/*.nupkg
      - name: Upload engine nupkg and snupkg
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-NuGet
          path: |
            artifacts/engine/*.nupkg
            artifacts/engine/*.snupkg
          if-no-files-found: error
          retention-days: 14
      - name: Upload CLI tool nupkg
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Cli
          path: artifacts/cli/*.nupkg
          if-no-files-found: error
          retention-days: 14
      # - name: Push nupkg and snupkg
      #   if: github.event_name != 'pull_request'
      #   env:
      #     NUGET_KEY: ${{ secrets.NUGET_KEY }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      #   run: python3 .github/scripts/push-packages.py --packages-dir artifacts
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  sdk:
    name: ${{ matrix.title }}
    needs: [version, test, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            sdk: jvm
            product: Java
            title: Java library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: jvm
            product: Java
            title: Java library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: jvm
            product: Java
            title: Java library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: python
            product: Python
            title: Python library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: python
            product: Python
            title: Python library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: python
            product: Python
            title: Python library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: node
            product: Node
            title: Node library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: node
            product: Node
            title: Node library (osx-arm64)
          - os: windows-latest
            rid: win-x64
            sdk: node
            product: Node
            title: Node library (win-x64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: react-native
            product: React-Native
            title: React Native library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: react-native
            product: React-Native
            title: React Native library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: go
            product: Go
            title: Go library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: go
            product: Go
            title: Go library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: cpp
            product: Cpp
            title: C++ library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: cpp
            product: Cpp
            title: C++ library (osx-arm64)
          - os: macos-latest
            rid: osx-arm64
            sdk: swift
            product: Swift
            title: Swift library (osx-arm64)
          - os: ubuntu-latest
            rid: linux-x64
            sdk: flutter
            product: Flutter
            title: Flutter library (linux-x64)
          - os: macos-latest
            rid: osx-arm64
            sdk: flutter
            product: Flutter
            title: Flutter library (osx-arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.sdk == 'jvm'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.sdk == 'jvm'
        with:
          gradle-version: "8.12.1"
          add-job-summary: never
      - uses: actions/setup-python@v5
        if: matrix.sdk == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.sdk == 'node' || matrix.sdk == 'react-native'
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        if: matrix.sdk == 'go'
        with:
          go-version: "1.22.x"
      - name: Install cgo toolchain
        if: matrix.sdk == 'go' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Install CMake
        if: matrix.sdk == 'cpp' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - uses: dart-lang/setup-dart@v1
        if: matrix.sdk == 'flutter'
      - name: Download native ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
      - name: Test and pack ${{ matrix.sdk }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            "${{ matrix.sdk }}" \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/${{ matrix.sdk }}-${{ matrix.rid }}" \
            "$PWD/artifacts/native/${{ matrix.rid }}"
      - name: Upload ${{ matrix.sdk }}
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-${{ matrix.product }}-${{ matrix.rid }}
          path: artifacts/sdk/${{ matrix.sdk }}-${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  android:
    name: Android AAR
    needs: [version, test, native, native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
          add-job-summary: never
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: Google removed the obsolete SDK Tools package.
          packages: platform-tools
      - name: Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-linux-x64
          path: artifacts/native/linux-x64
      - name: Download Android ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64
      - name: JVM unit tests (shared Android Kotlin)
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            jvm \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/android-jvm-tests" \
            "$PWD/artifacts/native/linux-x64"
      - name: Assemble AAR
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            android \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/android" \
            "$PWD/artifacts/native/android-arm64"
      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: NuvexaDB-Android
          path: artifacts/sdk/android/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  react-native-android:
    name: React Native Android
    needs: [version, test, native, native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
          add-job-summary: never
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default "tools platform-tools" fails: Google removed the obsolete SDK Tools package.
          packages: platform-tools
      - name: Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download desktop ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-linux-x64
          path: artifacts/native/linux-x64
      - name: Download Android ABI
        uses: actions/download-artifact@v4
        with:
          name: NuvexaDB-Native-android-arm64
          path: artifacts/native/android-arm64
      - name: Interop test cases
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native \
            "${{ needs.version.outputs.version }}" \
            "$PWD/artifacts/sdk/react-native-js" \
            "$PWD/artifacts/native/linux-x64"
      - name: Assemble React Native AAR
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run-sdk-ci.sh
          .github/scripts/run-sdk-ci.sh \
            react-native-android \
