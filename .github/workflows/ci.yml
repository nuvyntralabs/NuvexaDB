      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi

  publish-release:
    name: GitHub Release
    # A custom if: replaces GitHub's default "needs succeeded" check.
    # success() is required so a red tag run never creates or updates a Release.
    if: github.ref_type == 'tag' && success()
    needs:
      - version
      - test
      - native
      - native-android
      - native-ios
      - vscode
      - vsix
      - explorer
      - pack
      - sdk
      - android
      - react-native-android
      - react-native-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NuvexaDB-*
          path: release-artifacts
          merge-multiple: false
      - name: Zip artifacts for the release
        run: |
          set -euo pipefail
          chmod +x .github/scripts/stage-release-assets.sh
          .github/scripts/stage-release-assets.sh "$PWD/release-artifacts" "$PWD/dist"
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${{ needs.version.outputs.version }}"
          gh release create "$tag" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "NuvexaDB ${version}" \
            --generate-notes \
            --verify-tag
      - if: always()
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then : > "$GITHUB_STEP_SUMMARY"; fi
